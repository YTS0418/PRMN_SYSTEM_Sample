spring.application.name=grades-vaadin

# データベースの接続先（データベース編 07〜09 章で作った grades_db）
spring.datasource.url=jdbc:postgresql://localhost:5432/grades_db
spring.datasource.username=postgres
# パスワードは、環境変数 DB_PASSWORD から読む（設定ファイルに直接書かない）
spring.datasource.password=${DB_PASSWORD}

# セッションと Cookie の設定（フロントエンド編 12 章）
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTPS で公開するときは、次の行を有効にする（開発の http://localhost では、有効にしない）
# server.servlet.session.cookie.secure=true
